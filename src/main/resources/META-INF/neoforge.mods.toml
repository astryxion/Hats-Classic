license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
credits="${mod_credits}"
description='''${mod_description}'''

[[mixins]]
config="hats.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mobends"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="skinlayers3d"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
