# Sets default memory used for gradle commands.
# Increased to 4G for smoother building of the release artifact.
org.gradle.jvmargs=-Xmx4G -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.daemon=false

## Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
# 1.21.1+ so the mod stays loadable on later versions while the code stays compatible.
minecraft_version_range=[1.21.1,)
neo_version=21.1.265
loader_version_range=[21.1,)

## Mod Properties
# Must match com.astryxion.hats.Hats.MODID
mod_id=hats
mod_name=Hats (Classic)
mod_license=GNU Lesser General Public License v3.0
mod_version=1.21.1-3.0.0
mod_group_id=com.astryxion.hats
mod_authors=Astryxion
mod_credits=Antikythera Studios, Contributors, fonnymunkey, iChun
mod_description=Hats (Classic) brings the classic Hats mod experience to modern Minecraft, combining beloved features from older releases with select improvements from modern versions, updated for modern use and broad mod compatibility.
