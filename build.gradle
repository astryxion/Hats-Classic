buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {

    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // Dual-client LAN testing. Existing runClient is unchanged.
        // Inherit the full client launch (same Forge/MC/mod), then override
        // username + game directory so two instances can run at once.
        clientPlayer1 {
            parent runs.client
            workingDirectory project.file('run-player1')
            args '--username', 'Player1', '--uuid', '11111111-1111-1111-1111-111111111111'
        }

        clientPlayer2 {
            parent runs.client
            workingDirectory project.file('run-player2')
            args '--username', 'Player2', '--uuid', '22222222-2222-2222-2222-222222222222'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Standard Forge layout: everything under src/main/resources/ lands at jar root (META-INF/mods.toml, assets/, data/, mixins).
// Do not point only at src/main/resources/resources — that folder is empty here and produced jars with no mods.toml (mod invisible in-game / on CurseForge).
sourceSets {
    main {
        java {
            if (file('libs/entity_model_features-3.3.9-1.20.1-forge.jar').exists()) {
                exclude 'traben/**'
            }
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
        }
    }
}

repositories {

    // Enable local ./libs folder for soft-compat jars
    flatDir {
        dir 'libs'
    }
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ============================
    // MO' BENDS OPTIONAL COMPAT
    // ============================

    if (file('libs/MoBends_1.20.1-3.0.4.jar').exists()) {
        compileOnly name: "MoBends_1.20.1-3.0.4"
    }

    // Fresh Animations runtime (EMF). Optional at runtime; needed so the
    // optional EMF mixin can compile against renderLikeVanilla.
    if (file('libs/entity_model_features-3.3.9-1.20.1-forge.jar').exists()) {
        compileOnly name: "entity_model_features-3.3.9-1.20.1-forge"
    }
    if (file('libs/entity_texture_features-7.2.4-1.20.1-forge.jar').exists()) {
        compileOnly name: "entity_texture_features-7.2.4-1.20.1-forge"
    }
}

mixin {
    add sourceSets.main, 'hats.refmap.json'
    config 'hats.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_credits: mod_credits, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'hats.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'

    // Compile stand-in for the optional EMF mixin target. Never ship it.
    exclude 'traben/**'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
