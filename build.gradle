import groovy.json.JsonOutput

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def hatModId = "hats"
def hatItemModelsDir = file("src/main/resources/assets/${hatModId}/models/item")
def generatedHatItemsRoot = layout.buildDirectory.dir("generated/resources/hatItemDefinitions")

sourceSets.main.resources.srcDir(generatedHatItemsRoot)

// Minecraft 26.1: assets/<namespace>/items/<id>.json is required so ITEM_MODEL resolves (models/item alone is not enough).
tasks.register('generateHatItemDefinitions') {
	inputs.dir(hatItemModelsDir).withPropertyName("hatItemModels")
	outputs.dir(layout.buildDirectory.dir("generated/resources/hatItemDefinitions/assets/${hatModId}/items"))

	doLast {
		def outItems = file("${layout.buildDirectory.get()}/generated/resources/hatItemDefinitions/assets/${hatModId}/items")
		outItems.mkdirs()
		def blacklist = ["hatparent", "hatparent2", "simplehats_icon", "haticon"] as Set
		hatItemModelsDir.eachFile { f ->
			if (!f.name.endsWith(".json")) {
				return
			}
			def stem = f.name.substring(0, f.name.length() - 5)
			if (blacklist.contains(stem.toLowerCase(java.util.Locale.ROOT))) {
				return
			}
			def payload = [
				model: [
					type  : "minecraft:model",
					model : "${hatModId}:item/${stem}"
				]
			]
			new File(outItems, "${stem}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(payload))
		}
	}
}

processResources.dependsOn('generateHatItemDefinitions')

afterEvaluate {
	tasks.named('sourcesJar').configure {
		dependsOn('generateHatItemDefinitions')
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hats" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file.
	// Loom needs an exact minecraft_version; fabric.mod.json uses minecraft_version_range for depends.minecraft.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
}

processResources {
	def version = project.version
	def minecraftVersionRange = project.minecraft_version_range
	inputs.property "version", version
	inputs.property "minecraft_version_range", minecraftVersionRange

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version_range": minecraftVersionRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
